name: CI

# Only main and pull requests into main (the required checks rust/msrv/macos protect
# main). The paths lists must cover everything the jobs below depend on (sources, tests
# and their fixtures, presets, manifests, this file); docs-only changes (README, bench/,
# AGENTS.md, ...) and tools/ (generators whose output is committed under src/) skip CI.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'presets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'presets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

# A new push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Draft PRs get no CI (ready_for_review starts it); run the checks locally meanwhile.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --features test-hooks -- -D warnings
      - run: cargo test --locked
  msrv:
    # The oldest Rust that builds bab (Cargo.toml `rust-version`, README): let-chains need
    # 1.88. --locked proves the pinned dependencies build with it too.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets --features test-hooks
  macos:
    # The release wheels include macOS (pyproject.toml, release.yml): the kqueue/pipe
    # fallbacks of src/signals.rs and src/core/slurm.rs (no pidfd/pipe2 there), tested
    # on Apple silicon.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked --features test-hooks -- -D warnings
      - run: cargo test --locked --no-fail-fast
