# Python packaging for PyPI: maturin puts the `bab` binary into platform wheels
# (`bindings = "bin"`), no Python code. The version comes from Cargo.toml. Releasing: README.
[build-system]
requires = ["maturin>=1.9.2,<2"]  # 1.9.2: PEP 639 `license`/`license-files`
build-backend = "maturin"

[project]
name = "better-allegro-buddy"
dynamic = ["version"]
description = "A friendly Slurm helper: allegro-buddy rewritten in Rust (the `bab` command), byte-for-byte compatible and several times faster."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Grutschus" }, { name = "Michael Plainer" }]
maintainers = [{ name = "Michael Plainer" }]
keywords = ["slurm", "hpc", "cluster", "gpu", "cli", "allegro", "sbatch", "squeue"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/plainerman/better-allegro-buddy"
Repository = "https://github.com/plainerman/better-allegro-buddy"
Issues = "https://github.com/plainerman/better-allegro-buddy/issues"
Original = "https://github.com/Grutschus/allegro-buddy"

[tool.maturin]
bindings = "bin"
# The sdist holds only what builds the binary (Cargo.toml `include`): no compat/, bench/,
# tests/, tools/ or .github/.
