# Defaults for Lise (NHR@ZIB), which Slurm calls bhlrn4. Picked automatically
# when Slurm reports ClusterName = bhlrn4; users override any value in their
# own config.ini. Only put here what Slurm cannot tell allegro-buddy itself.

[dev]
# Slurm's own default partition on Lise is cpu-clx (CPU only). The test
# partition's MaxTime is 1h.
partition = gpu-a100:test
time = 01:00:00
gpu = 1
cpus = 8
mem = 8G

[gpu-labels]
# GRES types a100 and h200 already match what people type; no aliases needed.
# Listed order is the column order in `ab info` / `ab free`.
a100 = A100
1g_10gb = A100-MIG
h200 = H200
intel = PVC
