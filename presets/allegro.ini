# Defaults for the Allegro cluster. Picked automatically when Slurm reports
# ClusterName = allegro; users override any value in their own config.ini.
# Only put here what Slurm cannot tell allegro-buddy itself.

[dev]
# Slurm's own default partition on Allegro is `small` (CPU only).
partition = gpu
gpu = 1

[gpu-aliases]
# what people type = the GRES type on the nodes (lower-case, punctuation as _)
a5000 = rtx_a5000
gtx1080 = gtx_1080ti
gtx1080ti = gtx_1080ti

[gpu-labels]
# Listed order is the column order in `ab info` / `ab free`.
rtx_a5000 = A5000
gtx_1080ti = GTX1080
